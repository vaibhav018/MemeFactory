# Handles Watchlist — reference creators, NOT scraping targets.
#
# Instagram doesn't expose a practical public API, so this file has two jobs:
#
#   1. Institutional memory: when you're checking manually "what's working
#      right now for our audience", these are the creators to open first.
#
#   2. Style anchor for ideation: engine/ideation/watchlist.py loads this and
#      injects a compact "REFERENCE CREATORS" block into topic_generator's
#      prompt for pillars that have affinity handles. Claude uses them for
#      TONE and TOPIC AREA, never to copy content verbatim.
#
# How to edit:
#   - Add a handle when you notice a creator whose format is repeatedly
#     landing with our target 18-35 audience.
#   - Remove a handle if their content drifts off-pillar or their engagement
#     dies. This file rots fast — audit quarterly.
#   - pillar_affinity: list only pillars where THIS creator's style would
#     genuinely inform a post. Wide affinity dilutes the signal.
#
# Provenance: initial 7 handles pulled from the 2026-07-31 trend audit of
# 62 IG screenshots (see the pipeline commit da1328c neighborhood for context).

