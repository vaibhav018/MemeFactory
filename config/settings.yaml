account:
  ig_user_id: "${IG_USER_ID}"
  ig_access_token: "${IG_ACCESS_TOKEN}"
  github_repo: "vaibhav018/MemeFactory"

# LLM provider — set LLM_PROVIDER env var to switch, or change default here.
# Supported: groq | gemini | openrouter
# All are free-tier. Set the corresponding API key in .env:
#   GROQ_API_KEY      — get free at console.groq.com
#   GEMINI_API_KEY    — get free at aistudio.google.com
#   OPENROUTER_API_KEY— get free at openrouter.ai
llm:
  provider: "groq"          # default — change to gemini or openrouter
  groq_model: "llama-3.3-70b-versatile"
  gemini_model: "gemini-2.0-flash"
  openrouter_model: "meta-llama/llama-3.3-70b-instruct:free"

carousel:
  slides: 7                     # hook + 5 content + CTA
  width: 1080
  height: 1080
  font_size_hook: 72
  font_size_body: 56
  font_size_footer: 28
  slide_duration_reels: 3       # seconds per slide if exported as Reel

schedule:
  # Note: authoritative schedule lives in .github/workflows/profit_prompts.yml
  # (this file is documentation only — GH Actions cron is what actually fires).
  # Times in IST (UTC+5:30) — both slots fire every day.
  morning_post_time: "11:00"    # 05:30 UTC daily
  evening_post_time: "19:30"    # 14:00 UTC daily
  posts_per_day: 2

quality:
  min_hook_words: 6
  max_hook_words: 14
  min_slide_words: 15
  max_slide_words: 55
  min_total_slides: 7
  max_total_slides: 7
  required_emoji_ratio: 0.0     # no forced emoji; quality gate checks presence
  duplicate_lookback_days: 30

paths:
  post_history_db: "data/post_history.db"
  queue_pending: "queue/pending"
  queue_approved: "queue/approved"
  queue_posted: "queue/posted"
  generated_memes: "Generated_Memes"
  library_hooks: "library/hooks_library.yaml"
  library_top_performers: "library/top_performers.json"
