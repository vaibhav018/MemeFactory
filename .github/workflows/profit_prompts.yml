name: profit-prompts

# Scheduled Instagram carousel publisher for @profit_prompts_.
# Runs pipeline.py --publish on GitHub-hosted runners so the phone/laptop
# can be off entirely. All secrets live under repo Settings → Secrets.
#
# Required repo secrets:
#   IG_ACCESS_TOKEN   - long-lived Instagram Graph API token
#   IG_USER_ID        - numeric IG user id (28084089337890165)
#   GROQ_API_KEY      - Groq free-tier LLM key
#   CF_ACCOUNT_ID     - Cloudflare account id (for Workers AI FLUX)
#   CF_API_TOKEN      - Cloudflare API token (scope: Workers AI)
#
# GITHUB_TOKEN is auto-provided; used by pipeline.py to push carousel
# JPGs back to the repo so IG can fetch them via raw.githubusercontent.com.

on:
  schedule:
    # ~11:00 AM IST. Deliberately not on the half hour: GitHub queues scheduled
    # runs and drops or delays the ones landing on congested minutes, and :00
    # and :30 are the most congested there are.
    - cron: "27 5 * * *"
    # Catch-ups. GitHub's cron is best-effort and this slot has been landing
    # 23-31 minutes late; on 27 Aug 2026 it did not fire at all — no run, no
    # failure, nothing in the history to notice. Each attempt asks Instagram
    # whether the slot is already filled and exits if so.
    - cron: "13 6 * * *"
    - cron: "41 7 * * *"
    # The 14:00 UTC evening carousel is retired: the night slot is now a Reel,
    # published by profit_prompts_reel.yml at 13:00 UTC. Leaving both enabled
    # posted twice within an hour.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no image gen, no IG publish, no commits)"
        type: boolean
        default: false

# Never let two runs step on each other's git push.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write   # pipeline.py commits slide JPGs to Generated_Memes/

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deep enough for pipeline.py's `git pull --rebase origin main`
          fetch-depth: 0
          persist-credentials: true

      # Carousels are now a 3-per-fortnight format, not a daily one: they
      # averaged 1-4 likes while the reels pull 40+, so the queue decides which
      # days get one. An empty queue is a reel-only day, not a failure — and
      # nothing here falls back to live generation any more, because that
      # fallback is what filled the grid with the posts nobody engaged with.
      - name: Decide whether today gets a carousel
        id: slot
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          IST_DATE=$(TZ=Asia/Kolkata date +%Y%m%d)
          MANIFEST=$(ls -1 "Generated_Memes/${IST_DATE}"_*/carousel.json 2>/dev/null | head -1 || true)
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          if [ -z "$MANIFEST" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "No carousel built for $IST_DATE — reel-only day. Exiting cleanly."
            exit 0
          fi
          echo "Carousel for today: $MANIFEST"
          pip install requests --quiet
          if python scripts/posted_today.py --kind carousel; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "This is a catch-up run and the slot is already filled."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.slot.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: steps.slot.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Configure git
        if: steps.slot.outputs.go == 'true'
        run: |
          git config user.email "profit-prompts-bot@users.noreply.github.com"
          git config user.name "profit-prompts-bot"

      - name: Run pipeline
        if: steps.slot.outputs.go == 'true'
        env:
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID:   ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
          # GITHUB_REPOSITORY is auto-injected by Actions -- used by
          # engine.publish.instagram_client to build raw.githubusercontent URLs.
        run: |
          MANIFEST="${{ steps.slot.outputs.manifest }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python publish_roundup.py "$MANIFEST" --dry-run
          else
            python publish_roundup.py "$MANIFEST"
          fi
